name: Build pre-deploy tools (GHCR)
on:
  push:
    paths:
      - "ci-images/pre-deploy-test-tools/**"
      - ".github/workflows/build-pre-deploy-tools.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.value }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: meta
        run: |
          TAG="${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_ACCESS_TOKEN }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: ci-images/pre-deploy-test-tools
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/nishanau/ci-cd-templates/pre-deploy-tools:latest
            ghcr.io/nishanau/ci-cd-templates/pre-deploy-tools:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - name: Capture digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/nishanau/ci-cd-templates/pre-deploy-tools:${{ steps.meta.outputs.tag }} | awk '/Digest:/{print $2; exit}')
          echo "value=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### GHCR image" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/nishanau/ci-cd-templates/pre-deploy-tools:${{ steps.meta.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- digest: ${{ steps.digest.outputs.value }}" >> $GITHUB_STEP_SUMMARY
