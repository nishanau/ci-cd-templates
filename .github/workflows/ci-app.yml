# =====================================================================
#  Reusable Workflow: CI - App (Build, Scan, Push to Docker Hub)
# =====================================================================

name: CI - App (Build + Scan + Push)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full Docker Hub image name (e.g. nishanau/my-app)"
        required: true
        type: string
      context:
        description: "Docker build context"
        default: "."
        type: string
      dockerfile:
        description: "Dockerfile path"
        default: "./Dockerfile"
        type: string
      push_image:
        description: "Whether to push image to Docker Hub"
        default: true
        type: boolean
      run_tests:
        description: "Whether to run app lint/tests"
        default: true
        type: boolean

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: read
  security-events: write

# =====================================================================
# 1️⃣ Lint + Unit Tests
# =====================================================================
jobs:
  lint_test:
    runs-on: ubuntu-latest
    if: ${{ inputs.run_tests }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No recognized dependency manifest found"
          fi

      - name: Run tests
        run: |
          if [ -f package.json ]; then
            npm test || true
          elif [ -f pytest.ini ] || [ -d tests ]; then
            pytest || true
          else
            echo "No test suite found; skipping"
          fi

# =====================================================================
# 2️⃣ Build, Scan, then Push (scan gates the push)
# =====================================================================
  build_scan:
    runs-on: ubuntu-latest
    needs: [lint_test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # Build image locally to a tarball — NOT pushed yet
      # Scanning happens before any public push
      # ----------------------------------------------------------
      - name: Build image (local only)
        uses: docker/build-push-action@v6
        env:
          # This prevents the action from trying to collect metadata for the UI summary
          DOCKER_BUILD_SUMMARY: false  
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: true
          provenance: false # Keeps the actual attestation off
          sbom: false      # Ensure SBOM is also off
          tags: ${{ inputs.image_name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

            
      # ----------------------------------------------------------
      # Scan the locally loaded image BEFORE pushing
      # Pinned to immutable commit SHA — not a mutable tag
      # v0.35.0 @ 57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      # Verify: curl -s https://api.github.com/repos/aquasecurity/trivy-action/git/ref/tags/v0.35.0 | grep sha
      # ----------------------------------------------------------
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: ${{ inputs.image_name }}:sha-${{ github.sha }}
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      # ----------------------------------------------------------
      # Upload scan results to GitHub Security tab (always runs,
      # even if Trivy finds issues — so results are visible)
      # ----------------------------------------------------------
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      # ----------------------------------------------------------
      # Login and push ONLY after a clean scan
      # ----------------------------------------------------------
      - name: Push image to Docker Hub
        if: ${{ inputs.push_image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          load: false
          provenance: true
          tags: |
            ${{ inputs.image_name }}:sha-${{ github.sha }}
            ${{ inputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
