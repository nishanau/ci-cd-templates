# =====================================================================
#  Reusable Workflow: CI - App (Build, Scan, Push to Docker Hub)
# =====================================================================

name: CI - App (Build + Scan + Push)

on:
  workflow_call:
    inputs:
      image_name:
        description: "Full Docker Hub image name (e.g. nishanau/my-app)"
        required: true
        type: string
      context:
        description: "Docker build context"
        default: "."
        type: string
      dockerfile:
        description: "Dockerfile path"
        default: "./Dockerfile"
        type: string
      push_image:
        description: "Whether to push image to Docker Hub"
        default: true
        type: boolean
      run_tests:
        description: "Whether to run app lint/tests"
        default: true
        type: boolean

    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  packages: read
  security-events: write

# =====================================================================
# 1️⃣ Lint + Unit Tests
# =====================================================================
jobs:
  lint_test:
    runs-on: ubuntu-latest
    if: ${{ inputs.run_tests }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No recognized dependency manifest found"
          fi

      - name: Run tests
        run: |
          if [ -f package.json ]; then
            npm test || true
          elif [ -f pytest.ini ] || [ -d tests ]; then
            pytest || true
          else
            echo "No test suite found; skipping"
          fi

# =====================================================================
# 2️⃣ Build, Push, and Scan
# =====================================================================
  build_scan:
    runs-on: ubuntu-latest
    needs: [lint_test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------------------------
      # Login to Docker Hub using your secrets
      # ----------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build and push Docker image
      # ----------------------------------------------------------
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push_image }}
          tags: |
            ${{ inputs.image_name }}:sha-${{ github.sha }}
            ${{ inputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          labels: |
            org.opencontainers.image.source=${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      # ----------------------------------------------------------
      # Scan built image using Trivy
      # ----------------------------------------------------------
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ inputs.image_name }}:sha-${{ github.sha }}
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'

      # ----------------------------------------------------------
      # Upload scan results to GitHub Security tab
      # ----------------------------------------------------------
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
